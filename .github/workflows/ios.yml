name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate the iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          ls ios/App

      - name: Build (no signing)
        run: |
          set -e
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Surge-unsigned.ipa Payload
          ls -la Surge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Surge-unsigned-ipa
          path: Surge-unsigned.ipa
          retention-days: 30
